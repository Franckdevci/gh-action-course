spring:
  application:
    name: ecotrack-api
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    java:
      enabled: true
    build:
      enabled: true

ecotrack:
  features:
    export-csv: false
  export:
    max-lignes: 10000
  retention:
    journal-alertes-mois: 24
